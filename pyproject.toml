[project]
name = "idt-prep-copilot"
version = "0.6.0"
description = "An agentic copilot that drafts cited IDT meeting briefs for PACE care teams, built on synthetic data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "mcp>=2.3,<3",
    "langgraph>=1.0,<2",
    "anthropic>=0.70",
]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
idt-build-cohort = "idt_copilot.data.build_cohort:main"
idt-load-db = "idt_copilot.db.load:main"
idt-chart-server = "idt_copilot.chart.server:main"
idt-brief = "idt_copilot.agent.run:main"
idt-eval = "idt_copilot.evals.run_evals:main"
idt-export = "idt_copilot.export.static_bundle:main"
idt-live-dev = "idt_copilot.api.server:main"
idt-live-server = "idt_copilot.api.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"idt_copilot.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
